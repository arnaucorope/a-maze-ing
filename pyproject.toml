[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator and solver"
readme = "mazegen/README.md"
authors = [
    {name = "Arnau Corominas"},
    {name = "Sara Ayala"}
]
requires-python = ">=3.10"

[tool.setuptools]
packages = ["mazegen"]

[tool.setuptools.package-data]
mazegen = ["README.md"]
